name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Create a destroy plan or apply an existing reviewed destroy plan"
        required: true
        type: choice
        options:
          - destroy-plan
          - destroy

      plan_run_id:
        description: "Destroy-plan workflow run ID (required only for destroy)"
        required: false
        type: string

      confirmation:
        description: "Type DESTROY when applying a reviewed destroy plan"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_WORKING_DIR: environments/waste-lab
  TF_VERSION: "1.9.8"
  TF_STATE_PREFIX: waste-lab

  GCP_REGION: asia-south1
  CLOUD_RUN_JOB: finops-optimizer-agent

jobs:

  # ============================================================
  # DESTROY PLAN
  # ============================================================

  destroy-plan:
    name: Terraform Destroy Plan
    if: ${{ inputs.action == 'destroy-plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository configuration
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || \
            (echo "ERROR: Missing GCP_PROJECT_ID" && exit 1)

          test -n "${{ vars.TF_STATE_BUCKET }}" || \
            (echo "ERROR: Missing TF_STATE_BUCKET" && exit 1)

          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || \
            (echo "ERROR: Missing GCP_WIF_PROVIDER" && exit 1)

          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || \
            (echo "ERROR: Missing GCP_SERVICE_ACCOUNT" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure GCS backend
        run: cp backend.tf.example backend.tf

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      - name: Terraform Destroy Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform plan \
            -destroy \
            -out=tfplan

      - name: Show Terraform Destroy Plan
        run: terraform show -no-color tfplan

      - name: Save Destroy Plan Metadata
        run: |
          echo "PLAN_TYPE=destroy" > plan-metadata.env
          echo "PLAN_SHA=${GITHUB_SHA}" >> plan-metadata.env
          echo "PLAN_RUN_ID=${GITHUB_RUN_ID}" >> plan-metadata.env
          echo "PLAN_REPOSITORY=${GITHUB_REPOSITORY}" >> plan-metadata.env
          echo "PLAN_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> plan-metadata.env
          echo "PLAN_STATE_BUCKET=${{ vars.TF_STATE_BUCKET }}" >> plan-metadata.env

      - name: Show Destroy Plan Metadata
        run: cat plan-metadata.env

      - name: Upload Exact Terraform Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: |
            environments/waste-lab/tfplan
            environments/waste-lab/plan-metadata.env
          retention-days: 5
          if-no-files-found: error

      - name: Destroy Plan Summary
        run: |
          echo "### Terraform Destroy Plan Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Review the destroy plan carefully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "If approved, run this workflow again with:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- action: \`destroy\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- plan_run_id: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- confirmation: \`DESTROY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "After Terraform destruction succeeds, the FinOps Cloud Run Job will also be removed." >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # DESTROY
  # ============================================================

  destroy:
    name: Apply Exact Destroy Plan
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Safety checks
      # ----------------------------------------------------------

      - name: Validate Destroy Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: confirmation must be exactly DESTROY"
            exit 1
          fi

      - name: Validate Destroy Plan Run ID
        run: |
          if [ -z "${{ inputs.plan_run_id }}" ]; then
            echo "ERROR: plan_run_id is required"
            exit 1
          fi

          if ! [[ "${{ inputs.plan_run_id }}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: plan_run_id must be numeric"
            exit 1
          fi

      # ----------------------------------------------------------
      # Download reviewed destroy plan OUTSIDE workspace
      # ----------------------------------------------------------

      - name: Download Reviewed Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ inputs.plan_run_id }}
          path: ${{ runner.temp }}/reviewed-destroy-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Downloaded Destroy Artifact
        run: |
          find "${RUNNER_TEMP}/reviewed-destroy-plan" \
            -type f \
            -print

          test -f "${RUNNER_TEMP}/reviewed-destroy-plan/tfplan" || \
            (echo "ERROR: tfplan not found" && exit 1)

          test -f "${RUNNER_TEMP}/reviewed-destroy-plan/plan-metadata.env" || \
            (echo "ERROR: plan metadata not found" && exit 1)

      # ----------------------------------------------------------
      # Validate metadata
      # ----------------------------------------------------------

      - name: Validate Destroy Plan Metadata
        id: metadata
        run: |
          METADATA_FILE="${RUNNER_TEMP}/reviewed-destroy-plan/plan-metadata.env"

          cat "$METADATA_FILE"

          PLAN_TYPE=$(grep '^PLAN_TYPE=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_SHA=$(grep '^PLAN_SHA=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_RUN_ID=$(grep '^PLAN_RUN_ID=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_REPOSITORY=$(grep '^PLAN_REPOSITORY=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_PROJECT_ID=$(grep '^PLAN_PROJECT_ID=' "$METADATA_FILE" | cut -d= -f2-)
          PLAN_STATE_BUCKET=$(grep '^PLAN_STATE_BUCKET=' "$METADATA_FILE" | cut -d= -f2-)

          test "$PLAN_TYPE" = "destroy" || \
            (echo "ERROR: Not a destroy plan" && exit 1)

          test "$PLAN_RUN_ID" = "${{ inputs.plan_run_id }}" || \
            (echo "ERROR: Plan Run ID mismatch" && exit 1)

          test "$PLAN_REPOSITORY" = "$GITHUB_REPOSITORY" || \
            (echo "ERROR: Repository mismatch" && exit 1)

          test "$PLAN_PROJECT_ID" = "${{ vars.GCP_PROJECT_ID }}" || \
            (echo "ERROR: GCP project mismatch" && exit 1)

          test "$PLAN_STATE_BUCKET" = "${{ vars.TF_STATE_BUCKET }}" || \
            (echo "ERROR: State bucket mismatch" && exit 1)

          echo "plan_sha=$PLAN_SHA" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Checkout exact planned commit
      # ----------------------------------------------------------

      - name: Checkout Exact Destroy Plan Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.plan_sha }}

      # ----------------------------------------------------------
      # Authenticate
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure GCS Backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: cp backend.tf.example backend.tf

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      - name: Copy Exact Reviewed Destroy Plan
        run: |
          cp \
            "${RUNNER_TEMP}/reviewed-destroy-plan/tfplan" \
            "${TF_WORKING_DIR}/tfplan"

      - name: Show Exact Reviewed Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

      # ----------------------------------------------------------
      # Apply exact destroy plan
      # ----------------------------------------------------------

      - name: Apply Exact Reviewed Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # ----------------------------------------------------------
      # Delete FinOps Cloud Run Job
      #
      # Only runs AFTER Terraform destroy succeeds.
      #
      # If job does not exist, workflow continues successfully.
      # ----------------------------------------------------------

      - name: Delete FinOps Cloud Run Job
        run: |
          echo "Checking for Cloud Run Job: ${CLOUD_RUN_JOB}"

          if gcloud run jobs describe "${CLOUD_RUN_JOB}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${GCP_REGION}" \
            >/dev/null 2>&1; then

            echo "Deleting Cloud Run Job..."

            gcloud run jobs delete "${CLOUD_RUN_JOB}" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${GCP_REGION}" \
              --quiet

            echo "Cloud Run Job deleted."

          else

            echo "Cloud Run Job does not exist."
            echo "Nothing to delete."

          fi

      # ----------------------------------------------------------
      # Summary
      # ----------------------------------------------------------

      - name: Destroy Summary
        if: ${{ success() }}
        run: |
          echo "### FinOps Lab Destroy Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Terraform Destroy Plan: \`${{ inputs.plan_run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform Commit: \`${{ steps.metadata.outputs.plan_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GCP Project: \`${{ vars.GCP_PROJECT_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run Job: \`${CLOUD_RUN_JOB}\` removed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Terraform infrastructure and the FinOps Agent Cloud Run Job were removed." >> "$GITHUB_STEP_SUMMARY"